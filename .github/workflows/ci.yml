name: CI/CD Pipeline

permissions:
  contents: write

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - master

jobs:
  ci:
    name: Laravel CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, bcmath, sqlite

  deploy:
    name: Deploy to Server
    if: github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Deploy via FTP (sync changes only)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_FTP_HOST }}
          username: ${{ secrets.SERVER_FTP_USERNAME }}
          password: ${{ secrets.SERVER_FTP_PASSWORD }}
          server-dir: ${{ secrets.SERVER_FTP_PATH }}
          dangerous-clean-slate: false
          exclude: |
            public/**
            node_modules/**
            vendor/**
            .git/**
            .htaccess
            .env

  release:
    name: Semantic Release + Changelog
    if: github.ref == 'refs/heads/master'
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install semantic-release dependencies
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator

      - name: Run Semantic Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
